# Gmail SMTP (recommended for quick testing). Use App Password (Google Account -> Security -> App passwords).
# You can either set these directly (replace values) or set environment variables `SMTP_USERNAME` and `SMTP_PASSWORD`.
# Using environment variables avoids committing secrets to source files.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
